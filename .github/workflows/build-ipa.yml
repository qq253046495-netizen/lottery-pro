name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Refresh lottery data (best-effort)
        continue-on-error: true
        run: python3 scripts/fetch_lottery.py --n 150

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (no signing)
        run: |
          xcodebuild archive \
            -project LotteryPro.xcodeproj \
            -scheme LotteryPro \
            -configuration Release \
            -archivePath "$PWD/build/LotteryPro.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual

      - name: Package unsigned IPA
        run: |
          mkdir -p export/Payload
          cp -R build/LotteryPro.xcarchive/Products/Applications/LotteryPro.app export/Payload/
          cd export
          zip -r LotteryPro-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LotteryPro-unsigned-ipa
          path: export/LotteryPro-unsigned.ipa
          if-no-files-found: error
