name: Update Lottery Data

# 注意：GitHub 云端 runner 在海外，访问中彩网/体彩网经常超时，所以这里只保留手动触发。
# 日常自动更新由本机 Windows 计划任务 scripts/update_data.bat 负责（国内网络可直连官网）。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch data
        run: python scripts/fetch_lottery.py --n 200 --no-fallback
        env:
          SOURCE_DLT: ${{ secrets.SOURCE_DLT }}
          SOURCE_SSQ: ${{ secrets.SOURCE_SSQ }}
      - name: Commit
        run: |
          git config user.email "bot@github.com"
          git config user.name "lottery-bot"
          git add data/
          git commit -m "data: update $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
